version: 1
updated_at: 2026-04-13
intent: >
  Progressive-disclosure context map for AI agents working on phodex-web.
  Read the smallest sufficient layer first, then descend only into the task-relevant layer.

entrypoints:
  llm_index: /Users/young/mx/tmp/phodex-web/llms.txt
  root_agent_guide: /Users/young/mx/tmp/phodex-web/AGENTS.md

defaults:
  strategy:
    - Read level 0 first.
    - Stop if level 0 plus the nearest package guide is sufficient.
    - Pull in reference docs only for the active work surface.
    - Treat historical docs as supporting material, not truth, unless code confirms them.
  constraints:
    - Do not load all files into context by default.
    - Prefer package-local guidance over repo-wide guidance when editing inside one package.
    - Keep source-driven mobile-app restoration as the primary goal.

