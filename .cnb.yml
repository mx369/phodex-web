$:
  vscode:
    - runner:
        cpus: 2
      env:
        CNB_WELCOME_CMD: bash .cnb/preview-launch.sh
      docker:
        build: .ide/Dockerfile
      services:
        - vscode
        - docker
      stages:
        - name: install
          script:
            - bun install --frozen-lockfile
            - bun run build:web
        - name: export-preview-meta
          script:
            - bash .cnb/export-preview-meta.sh
